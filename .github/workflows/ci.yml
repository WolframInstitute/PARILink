name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects and the pull request title
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          check() {
            printf '%s\n' "$2" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error title=Commit convention::$1 must use type(scope): description, at most 72 characters."
              status=1
            fi
          }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            check 'Pull request title' "$TITLE"
          fi
          revisions=("$HEAD")
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            revisions+=("^$BASE")
          fi
          # Keep history from before this policy was introduced intact.
          policy=$(git log --diff-filter=A --format=%H -- .github/workflows/ci.yml | tail -1)
          if git rev-parse --verify "$policy^" >/dev/null 2>&1; then
            revisions+=("^$policy^")
          fi
          git log --format='%H %s' "${revisions[@]}" > "$RUNNER_TEMP/commits"
          while IFS= read -r line; do
            check "Commit ${line%% *}" "${line#* }"
          done < "$RUNNER_TEMP/commits"
          exit "$status"

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sources and hooks
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          sh -n .githooks/commit-msg
          bash -n scripts/fetch-deps.sh scripts/build-runtime.sh
          python3 -m py_compile tests/upstream/prepare.py scripts/runtime.py
          make test-hooks

  runtime:
    name: GP runtime (${{ matrix.system }})
    needs: repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: Linux-x86-64, runner: ubuntu-22.04}
          - {system: Linux-ARM64, runner: ubuntu-22.04-arm}
          - {system: MacOSX-ARM64, runner: macos-15}
          - {system: MacOSX-x86-64, runner: macos-15-intel}
          - {system: Windows-x86-64, runner: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: base-devel mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime
        with:
          path: |
            build/runtimes/${{ matrix.system }}/*.tar.gz*
            build/runtime-sources/pari-*.tar.gz
            build/runtime-sources/gmp-*.tar.xz
          key: runtime-${{ matrix.system }}-${{ hashFiles('scripts/build-runtime.sh', 'scripts/runtime.py', 'scripts/runtime.json') }}

      - name: Build Unix runtime
        if: runner.os != 'Windows' && steps.runtime.outputs.cache-hit != 'true'
        run: make runtime

      - name: Build Windows runtime
        if: runner.os == 'Windows' && steps.runtime.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-runtime.sh

      - name: Preserve failed build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PARILink-build-logs-${{ matrix.system }}
          path: build/runtimes/${{ matrix.system }}/*.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PARILink-runtime-${{ matrix.system }}
          path: build/runtimes/${{ matrix.system }}/*.tar.gz*
          if-no-files-found: error
          compression-level: 0

  data:
    name: PARI sources and data
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/runtime-sources
          key: pari-sources-${{ hashFiles('scripts/runtime.json') }}

      - name: Download and verify the corresponding sources and data
        run: python3 scripts/runtime.py fetch --data

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PARILink-sources
          path: |
            build/runtime-sources/*.tar.gz
            build/runtime-sources/*.tar.xz
            build/runtime-sources/*.tgz
          if-no-files-found: error
          compression-level: 0

  paclet:
    name: Paclet (GP ${{ matrix.gp }})
    needs: [commits, repository, runtime, data]
    # Forks have no entitlement; their repository and commit checks still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gp: ['2.17.4', '2.19.0']
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      QT_QPA_PLATFORM: offscreen
      GP_SVG_VIEWER: /usr/bin/true
      GP_POSTSCRIPT_VIEWER: /usr/bin/true
    steps:
      # Git must exist before checkout, so PacletPage can record the commit.
      - name: Install runtime tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl make libgmp10 python3 unzip zstd binutils
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Wolfram Engine license
        run: |
          if [ -z "${WOLFRAMSCRIPT_ENTITLEMENTID:-}" ]; then
            echo '::error title=Missing license::Set WOLFRAMSCRIPT_ENTITLEMENTID; see CONTRIBUTING.md.'
            exit 1
          fi

      - uses: ./.github/actions/setup-pari
        if: matrix.gp == '2.17.4'
        with:
          version: ${{ matrix.gp }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.gp == '2.19.0'
        with:
          pattern: PARILink-runtime-*
          path: build/runtimes
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.gp == '2.19.0'
        with:
          name: PARILink-sources
          path: build/runtime-sources

      - name: Stage all five runtimes and shared data
        if: matrix.gp == '2.19.0'
        run: python3 scripts/runtime.py stage --all

      - name: Cache pinned documentation tools
        if: matrix.gp == '2.19.0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps/PacletPage
            .deps/MarkdownToNotebook
            .deps/WolframParser
          key: tools-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Cache PacletPage intermediates
        if: matrix.gp == '2.19.0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            PARILink/build/cache
            PARILink/build/incremental
            PARILink/build/build-context.txt
            PARILink/build/WolframInstitute__PARILink/Documentation
          key: pages-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/project.wls', 'scripts/fetch-deps.sh', '.github/actions/setup-pari/action.yml') }}-${{ hashFiles('PARILink/PacletInfo.wl', 'PARILink/Kernel/**', 'PARILink/Resources/**', 'docs/en/**', 'docs/ResourceDefinition.md') }}
          restore-keys: |
            pages-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/project.wls', 'scripts/fetch-deps.sh', '.github/actions/setup-pari/action.yml') }}-

      - name: Check, test, and build in one kernel
        env:
          TARGET: ${{ matrix.gp == '2.19.0' && 'ci-build' || 'ci' }}
          PARILINK_REQUIRE_ALL_RUNTIMES: ${{ matrix.gp == '2.19.0' && '1' || '' }}
        run: make "$TARGET"

      - name: Install the archive and test the public link without system GP
        if: matrix.gp == '2.19.0'
        run: wolframscript -file tests/Installed.wls PARILink/build/*.paclet

      - name: Preserve the verified archive and documentation
        if: matrix.gp == '2.19.0'
        run: |
          mkdir -p build/release
          cp PARILink/build/*.paclet build/release/
          tar --exclude=build/cache --exclude=build/incremental \
            -czf build/release/pacletpage-build.tar.gz -C PARILink \
            Documentation ResourceDefinition.nb build
          tar -czf build/release/PARILink-runtime-sources.tar.gz \
            scripts/build-runtime.sh scripts/runtime.py scripts/runtime.json \
            build/runtime-sources/*.tar.gz build/runtime-sources/*.tar.xz build/runtime-sources/*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.gp == '2.19.0'
        with:
          name: PARILink-verified
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  installed-runtime:
    name: Packaged GP (${{ matrix.system }})
    needs: paclet
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: Linux-x86-64, runner: ubuntu-22.04}
          - {system: Linux-ARM64, runner: ubuntu-22.04-arm}
          - {system: MacOSX-ARM64, runner: macos-15}
          - {system: MacOSX-x86-64, runner: macos-15-intel}
          - {system: Windows-x86-64, runner: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PARILink-verified
          path: build/release

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-python

      - name: Run GP from the final archive without a system installation
        if: runner.os != 'Windows'
        run: python3 scripts/runtime.py check-archive build/release/*.paclet --all

      - name: Run packaged GP on Windows without a system installation
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python3 scripts/runtime.py check-archive build/release/*.paclet --all
