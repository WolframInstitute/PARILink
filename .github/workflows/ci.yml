name: CI

on:
  push:
    branches: [main]
    # CI never reads these files, so a change to them alone starts no run. Keep the list the
    # same under push and pull_request.
    paths-ignore:
      - AGENTS.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - docs/architecture.md
      - docs/compatibility.md
  pull_request:
    branches: [main]
    paths-ignore:
      - AGENTS.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - docs/architecture.md
      - docs/compatibility.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sources and hooks
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
          sh -n .githooks/commit-msg .githooks/pre-commit
          test -x .githooks/pre-commit
          bash -n scripts/fetch-deps.sh scripts/build-runtime.sh
          test -x scripts/license-machine-name.sh
          sh -n scripts/license-machine-name.sh
          python3 -m py_compile tests/upstream/prepare.py scripts/runtime.py
          make test-hooks

  # A license line is issued for one machine name. The Wolfram job containers get that name as
  # their host name, so the name is read here, before those containers start. Without a license
  # line it is a default name; see CONTRIBUTING.md, "Continuous integration".
  license:
    name: Wolfram license
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      machine-name: ${{ steps.machine.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the machine name of the license
        id: machine
        env:
          WOLFRAM_MATHPASS_B64: ${{ secrets.WOLFRAM_MATHPASS_B64 }}
        run: |
          name=$(scripts/license-machine-name.sh)
          echo "name=$name" >> "$GITHUB_OUTPUT"

  runtime:
    name: GP runtime (${{ matrix.system }})
    needs: repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: Linux-x86-64, runner: ubuntu-22.04}
          - {system: Linux-ARM64, runner: ubuntu-22.04-arm}
          - {system: MacOSX-ARM64, runner: macos-15}
          - {system: MacOSX-x86-64, runner: macos-15-intel}
          - {system: Windows-x86-64, runner: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: base-devel mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: runtime
        with:
          path: |
            build/runtimes/${{ matrix.system }}/*.tar.gz*
            build/runtime-sources/pari-*.tar.gz
            build/runtime-sources/gmp-*.tar.xz
          key: runtime-${{ matrix.system }}-${{ hashFiles('scripts/build-runtime.sh', 'scripts/runtime.py', 'scripts/runtime.json') }}

      - name: Build Unix runtime
        if: runner.os != 'Windows' && steps.runtime.outputs.cache-hit != 'true'
        run: make runtime

      - name: Build Windows runtime
        if: runner.os == 'Windows' && steps.runtime.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-runtime.sh

      - name: Preserve failed build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PARILink-build-logs-${{ matrix.system }}
          path: build/runtimes/${{ matrix.system }}/*.log
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PARILink-runtime-${{ matrix.system }}
          path: build/runtimes/${{ matrix.system }}/*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  data:
    name: PARI sources and data
    needs: repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/runtime-sources
          key: pari-sources-${{ hashFiles('scripts/runtime.json') }}

      - name: Download and verify the corresponding sources and data
        run: python3 scripts/runtime.py fetch --data

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PARILink-sources
          path: |
            build/runtime-sources/*.tar.gz
            build/runtime-sources/*.tar.xz
            build/runtime-sources/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  paclet:
    name: Paclet (GP ${{ matrix.gp }})
    needs: [repository, license, runtime, data]
    # Forks have no license secrets; their repository checks still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gp: ['2.17.4', '2.19.0']
    container:
      image: wolframresearch/wolframengine:15.0
      # The host name and the machine-id in .github/actions/wolfram-license give the
      # container the MathID that the license line is issued for.
      options: --user root --hostname ${{ needs.license.outputs.machine-name || 'parilink-ci' }}
    env:
      # With a license line the kernel is licensed offline, and the entitlement is left out.
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAM_MATHPASS_B64 == '' && secrets.WOLFRAMSCRIPT_ENTITLEMENTID || '' }}
      QT_QPA_PLATFORM: offscreen
      GP_SVG_VIEWER: /usr/bin/true
      GP_POSTSCRIPT_VIEWER: /usr/bin/true
    steps:
      # Git must exist before checkout, so PacletPage can record the commit.
      - name: Install runtime tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl make libgmp10 python3 unzip zstd binutils
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify Wolfram Engine license
        uses: ./.github/actions/wolfram-license
        with:
          mathpass: ${{ secrets.WOLFRAM_MATHPASS_B64 }}

      - uses: ./.github/actions/setup-pari
        if: matrix.gp == '2.17.4'
        with:
          version: ${{ matrix.gp }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.gp == '2.19.0'
        with:
          pattern: PARILink-runtime-*
          path: build/runtimes
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.gp == '2.19.0'
        with:
          name: PARILink-sources
          path: build/runtime-sources

      - name: Stage all five runtimes and shared data
        if: matrix.gp == '2.19.0'
        run: python3 scripts/runtime.py stage --all

      - name: Cache pinned documentation tools
        if: matrix.gp == '2.19.0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps/PacletPage
            .deps/MarkdownToNotebook
            .deps/WolframParser
          key: tools-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Cache PacletPage intermediates
        if: matrix.gp == '2.19.0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            PARILink/build/cache
            PARILink/build/incremental
            PARILink/build/build-context.txt
            PARILink/build/WolframInstitute__PARILink/Documentation
          key: pages-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/*.wl', 'scripts/*.wls', 'scripts/fetch-deps.sh', '.github/actions/setup-pari/action.yml') }}-${{ hashFiles('PARILink/PacletInfo.wl', 'PARILink/Kernel/**', 'PARILink/Resources/**', 'docs/en/**', 'docs/ResourceDefinition.md') }}
          restore-keys: |
            pages-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/*.wl', 'scripts/*.wls', 'scripts/fetch-deps.sh', '.github/actions/setup-pari/action.yml') }}-

      - name: Check, test, and build in one kernel
        env:
          TARGET: ${{ matrix.gp == '2.19.0' && 'ci-build' || 'ci' }}
          PARILINK_REQUIRE_ALL_RUNTIMES: ${{ matrix.gp == '2.19.0' && '1' || '' }}
        run: make "$TARGET"

      - name: Install the archive and test the public link without system GP
        if: matrix.gp == '2.19.0'
        run: wolframscript -file tests/Installed.wls PARILink/build/*.paclet

      - name: Preserve the verified archive and documentation
        if: matrix.gp == '2.19.0'
        run: |
          mkdir -p build/release
          cp PARILink/build/*.paclet build/release/
          tar --exclude=build/cache --exclude=build/incremental \
            -czf build/release/pacletpage-build.tar.gz -C PARILink \
            Documentation ResourceDefinition.nb build
          tar -czf build/release/PARILink-runtime-sources.tar.gz \
            scripts/build-runtime.sh scripts/runtime.py scripts/runtime.json \
            build/runtime-sources/*.tar.gz build/runtime-sources/*.tar.xz build/runtime-sources/*.tgz

      - name: Verify release restoration in a clean checkout
        if: matrix.gp == '2.19.0'
        env:
          PARILINK_REQUIRE_ALL_RUNTIMES: '1'
        run: |
          clean="$RUNNER_TEMP/pari-release-check"
          git worktree add --detach "$clean" HEAD
          tar -xzf build/release/pacletpage-build.tar.gz -C "$clean/PARILink"
          cmp build/release/*.paclet "$clean"/PARILink/build/*.paclet
          cp -a "$clean/PARILink/build/WolframInstitute__PARILink/Resources/Runtime" "$clean/PARILink/Resources/"
          ln -s "$GITHUB_WORKSPACE/.deps" "$clean/.deps"
          make -C "$clean" check-build
          git worktree remove --force "$clean"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.gp == '2.19.0'
        with:
          name: PARILink-verified
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  installed-runtime:
    name: Packaged GP (${{ matrix.system }})
    needs: paclet
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: Linux-x86-64, runner: ubuntu-22.04}
          - {system: Linux-ARM64, runner: ubuntu-22.04-arm}
          - {system: MacOSX-ARM64, runner: macos-15}
          - {system: MacOSX-x86-64, runner: macos-15-intel}
          - {system: Windows-x86-64, runner: windows-2025}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PARILink-verified
          path: build/release

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-python

      - name: Run GP from the final archive without a system installation
        if: runner.os != 'Windows'
        run: python3 scripts/runtime.py check-archive build/release/*.paclet --all

      - name: Run packaged GP on Windows without a system installation
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python3 scripts/runtime.py check-archive build/release/*.paclet --all
