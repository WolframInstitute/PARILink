name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Every version updates the same cloud site; do not overlap deployments.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Find the verified build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      run: ${{ steps.ci.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag and require successful CI for its commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*"Version" -> "\([^"]*\)",/\1/p' PARILink/PacletInfo.wl)
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || [ "$TAG" != "v$version" ]; then
            echo '::error title=Release tag::Use vX.Y.Z matching PARILink/PacletInfo.wl.'
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || {
            echo '::error title=Release commit::Release tags must point to a commit on main.'
            exit 1
          }
          commit=$(git rev-parse HEAD)
          run=$(gh run list --workflow ci.yml --branch main --commit "$commit" \
            --limit 20 --json databaseId,event \
            --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId')
          if [ -z "$run" ]; then
            echo '::error title=Missing CI run::Run CI on main for the release commit before publishing.'
            exit 1
          fi
          gh run watch "$run" --exit-status --interval 30
          test "$(gh run view "$run" --json conclusion --jq .conclusion)" = success
          echo "run=$run" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish with PacletPage
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: wolframresearch/wolframengine:15.0
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
      QT_QPA_PLATFORM: offscreen
      GP_SVG_VIEWER: /usr/bin/true
      GP_POSTSCRIPT_VIEWER: /usr/bin/true
      PARILINK_REQUIRE_ALL_RUNTIMES: '1'
    steps:
      - name: Check publishing credentials
        env:
          WOLFRAM_CLOUD_USER: ${{ secrets.WOLFRAM_CLOUD_USER }}
          WOLFRAM_CLOUD_PASSWORD: ${{ secrets.WOLFRAM_CLOUD_PASSWORD }}
        run: |
          for name in WOLFRAMSCRIPT_ENTITLEMENTID WOLFRAM_CLOUD_USER WOLFRAM_CLOUD_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing credential::$name is not set; see CONTRIBUTING.md."
              exit 1
            fi
          done

      - name: Install publishing tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl make unzip zstd python3 binutils
          git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PARILink-verified
          path: build/release
          run-id: ${{ needs.verify.outputs.run }}
          github-token: ${{ github.token }}

      - name: Restore pinned documentation tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps/PacletPage
            .deps/MarkdownToNotebook
            .deps/WolframParser
          key: tools-${{ runner.os }}-${{ runner.arch }}-wl15-${{ hashFiles('scripts/fetch-deps.sh') }}

      - name: Restore the verified PacletPage build
        run: |
          tar -xzf build/release/pacletpage-build.tar.gz -C PARILink
          cmp build/release/*.paclet PARILink/build/*.paclet
          make deps

      - name: Publish the resource and documentation site
        env:
          WOLFRAM_CLOUD_USER: ${{ secrets.WOLFRAM_CLOUD_USER }}
          WOLFRAM_CLOUD_PASSWORD: ${{ secrets.WOLFRAM_CLOUD_PASSWORD }}
        run: make publish

  release:
    name: Publish GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PARILink-verified
          path: dist
          run-id: ${{ needs.verify.outputs.run }}
          github-token: ${{ github.token }}

      - name: Attach the verified paclet, corresponding sources, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          archive="WolframInstitute__PARILink-${TAG#v}.paclet"
          sources=PARILink-runtime-sources.tar.gz
          test -f "$archive"
          test -f "$sources"
          sha256sum "$archive" "$sources" > SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$archive" "$sources" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$archive" "$sources" SHA256SUMS \
              --title "$TAG" --generate-notes --verify-tag
          fi
